name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp version
        run: |
          V="v$(git rev-list --count HEAD)"
          T="$(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          grep -rl '__VERSION__' public | xargs sed -i "s|__VERSION__|$V|g"
          grep -rl '__BUILT__' public | xargs sed -i "s|__BUILT__|$T|g"
          printf '{"version":"%s","built":"%s","sha":"%s"}\n' "$V" "$T" "$(git rev-parse --short HEAD)" > public/version.json
          echo "Deploying $V ($T)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
