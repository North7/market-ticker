<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticker">
<meta name="theme-color" content="#000000">
<title>Market Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
body.idle, body.idle * { cursor: none !important; }
#stage { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); transition: transform 3s ease; }   /* 避開瀏海與圓角 */
#stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .9s ease; background: transparent; }
#stage iframe.on { opacity: 1; }

.dock { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 10;
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
  background: rgba(18, 18, 20, .74); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 255, 255, .08);
  transition: opacity .35s ease, transform .35s ease; font-family: 'Geist', 'Noto Sans TC', sans-serif; }
.dock.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.dock button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 999px; color: rgba(255, 255, 255, .62); font-size: 13px; font-weight: 500; letter-spacing: .01em; transition: background .2s, color .2s; white-space: nowrap; }
.dock button:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.dock button.on { color: #111; background: #f4f2ee; }
.dock button i { font-family: 'Geist Mono'; font-style: normal; font-size: 10.5px; opacity: .55; }
.dock button small { font-family: 'Noto Sans TC'; font-size: 11px; opacity: .6; }
.dock .sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .14); margin: 0 4px; }
.dock .auto.on { background: #f7931a; color: #111; }
.dock::-webkit-scrollbar { display: none; }
.fsbtn { position: fixed; right: calc(18px + env(safe-area-inset-right)); top: calc(16px + env(safe-area-inset-top)); z-index: 10; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: rgba(18, 18, 20, .74); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 8px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.1);
  opacity: 0; pointer-events: none; transition: opacity .35s, transform .2s; }
.fsbtn.show { opacity: 1; pointer-events: auto; }
.fsbtn:hover { transform: scale(1.06); }
.fsbtn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dock .fs { color: #fff; }
.toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); z-index: 11; pointer-events: none; opacity: 0;
  font-family: 'Geist', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: #fff;
  padding: 14px 26px; border-radius: 999px; background: rgba(18, 18, 20, .7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity .3s, transform .3s; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.help { position: fixed; right: 22px; bottom: 30px; z-index: 10; font-family: 'Geist Mono'; font-size: 10.5px; letter-spacing: .12em; color: rgba(255, 255, 255, .55);
  opacity: 0; transition: opacity .35s; pointer-events: none; text-align: right; line-height: 1.8; mix-blend-mode: difference; }
.help.show { opacity: 1; }
@media (max-width: 1480px) { .help { display: none; } }   /* 窄螢幕讓位給底部選單，按鍵說明已在選單按鈕上 */
@media (max-width: 1080px) { .dock button small { display: none; } }
@media (hover: none) { .dock button i, .help { display: none; } }   /* 觸控裝置沒有鍵盤，不顯示按鍵提示 */
@media (max-width: 600px) { .dock { bottom: calc(12px + env(safe-area-inset-bottom)); gap: 2px; padding: 5px; } .dock button { padding: 8px 10px; font-size: 12.5px; } .dock .sep { margin: 0 2px; } }
.nofs .fsbtn, .nofs .dock .fs { display: none; }
.dock .ver { padding: 0 10px 0 6px; font-family: 'Geist Mono', monospace; font-size: 10.5px; color: rgba(255,255,255,.38); white-space: nowrap; }   /* 版本只出現在底部選單裡，不擋畫面 */
</style>
</head>
<body>
<div id="stage"></div>
<nav class="dock" id="dock"></nav>
<button class="fsbtn" id="fsbtn" title="全螢幕（F）"><svg viewBox="0 0 24 24"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div class="toast" id="toast"></div>
<div class="help" id="help">1–8 / ← → 切換主題<br>A 自動輪播 · F 全螢幕</div>

<script>
const THEMES = [
  { id: 'signal', file: 'themes/b-signal.html', name: 'Signal', zh: '點陣' },
  { id: 'orbit', file: 'themes/d-orbit.html', name: 'Orbit', zh: '軌道' },
  { id: 'daybreak', file: 'themes/d-daybreak.html', name: 'Daybreak', zh: '破曉' },
  { id: 'mission', file: 'themes/m-mission.html', name: 'Mission', zh: '任務' },
  { id: 'glyph', file: 'themes/n-glyph.html', name: 'Glyph', zh: '符號' },
  { id: 'glow', file: 'themes/o-glow.html', name: 'Glow', zh: '發光' },
  { id: 'wave', file: 'themes/p-wave.html', name: 'Wave', zh: '波形' },
  { id: 'glass', file: 'themes/r-glass.html', name: 'Glass', zh: '玻璃' },
];
const AUTO_MS = 10 * 60 * 1000;
// 版本：部署時由 GitHub Actions 換成 v<commit 數> 與台北部署時間；本機執行保持原樣顯示 local
const VERSION = '__VERSION__', BUILT = '__BUILT__';
const DEPLOYED = /^v\d+$/.test(VERSION);
const store = {
  get(k, d) { try { const v = localStorage.getItem('mt.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mt.' + k, JSON.stringify(v)); } catch { /* ignore */ } },
};
const $ = (id) => document.getElementById(id);
const stage = $('stage'), dock = $('dock');

let idx = Math.max(0, THEMES.findIndex((t) => t.id === (location.hash.slice(1) || store.get('theme', 'signal'))));
let auto = store.get('auto', false), autoTimer = null;

// ---- 底部選單
THEMES.forEach((t, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<i>${(i + 1) % 10}</i>${t.name}<small>${t.zh}</small>`;
  b.onclick = () => go(i);
  dock.appendChild(b);
});
dock.insertAdjacentHTML('beforeend', '<span class="sep"></span>');
const autoBtn = document.createElement('button');
autoBtn.className = 'auto';
autoBtn.innerHTML = '<i>A</i>輪播';
autoBtn.onclick = () => setAuto(!auto);
dock.appendChild(autoBtn);
const fsBtn = document.createElement('button');
fsBtn.className = 'fs';
fsBtn.innerHTML = '<i>F</i><span id="fsTxt">全螢幕</span>';
fsBtn.onclick = toggleFull;
dock.appendChild(fsBtn);
dock.insertAdjacentHTML('beforeend', '<span class="ver" id="ver"></span>');
$('fsbtn').onclick = toggleFull;
const ICON_IN = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', ICON_OUT = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
const onFs = () => {
  const on = !!fsEl();
  $('fsTxt').textContent = on ? '退出' : '全螢幕';
  $('fsIcon').setAttribute('d', on ? ICON_OUT : ICON_IN);
  $('fsbtn').title = on ? '退出全螢幕（F）' : '全螢幕（F）';
};
document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);

function paintDock() {
  [...dock.querySelectorAll('button')].slice(0, THEMES.length).forEach((b, i) => {
    b.classList.toggle('on', i === idx);
    if (i === idx && dock.scrollWidth > dock.clientWidth) dock.scrollLeft = b.offsetLeft - (dock.clientWidth - b.offsetWidth) / 2;
  });
  autoBtn.classList.toggle('on', auto);
}

// ---- 切換（兩層 iframe 交叉淡入，舊的淡出後卸載，連線一起關掉）
function go(i, silent) {
  idx = (i + THEMES.length) % THEMES.length;
  const t = THEMES[idx];
  store.set('theme', t.id);
  history.replaceState(null, '', '#' + t.id);
  paintDock();
  const old = [...stage.querySelectorAll('iframe')];
  const f = document.createElement('iframe');
  f.src = DEPLOYED ? `${t.file}?v=${VERSION}` : t.file;
  f.title = t.name;
  f.onload = () => {
    wire(f);
    setTimeout(() => f.classList.add('on'), 30);   // 不用 rAF：視窗在背景時 rAF 會暫停，主題就一直是透明的
    old.forEach((o) => { o.classList.remove('on'); setTimeout(() => o.remove(), 1000); });
  };
  stage.appendChild(f);
  if (!silent) toast(t.name);
  if (auto) armAuto();
}

// 主題頁裡的按鍵、滑鼠也要能控制外殼
function wire(f) {
  try {
    const w = f.contentWindow;
    w.addEventListener('keydown', onKey);
    w.addEventListener('mousemove', onMove);
    w.addEventListener('click', onClick);

// ---- 觸控：左右滑切換主題，點一下叫出選單
// 圖表（.fx-zone）上拖動是查數據、詳情面板（.fx-back）裡的操作也不算換主題
function touch(w) {
  let x0, y0, t0, zone;
  w.addEventListener('touchstart', (e) => {
    if (e.target.closest && e.target.closest('.dock, .fx-back')) { x0 = null; return; }
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); zone = !!(e.target.closest && e.target.closest('.fx-zone'));
  }, { passive: true });
  w.addEventListener('touchend', (e) => {
    if (x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    lastTouch = Date.now();
    const dt = Date.now() - t0;
    // 換主題要「快速一揮」；在圖表上（.fx-zone）慢慢拖是查數據，所以那裡門檻更短
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < (zone ? 350 : 700)) { go(idx + (dx < 0 ? 1 : -1)); wake(); }
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 300 && !interactive(e.target)) toggleUi();   // 點一下：選單顯示／隱藏切換
  }, { passive: true });
}
touch(window);
    w.addEventListener('dblclick', toggleFull);
    touch(w);
  } catch { /* 同源才接得到 */ }
}

let toastT;
function toast(text) {
  const el = $('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1100);
}

function setAuto(v) {
  auto = v; store.set('auto', v); paintDock();
  toast(v ? 'Auto · 10 min' : 'Auto off');
  if (v) armAuto(); else clearTimeout(autoTimer);
}
function armAuto() { clearTimeout(autoTimer); autoTimer = setTimeout(() => go(idx + 1), AUTO_MS); }

const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFull() {
  const d = document, el = d.documentElement;
  if (fsEl()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); if (r && r.catch) r.catch(() => {}); }
}
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) document.body.classList.add('nofs');

function onKey(e) {
  const k = e.key;
  if (/^[0-9]$/.test(k) && (k === '0' ? 10 : +k) <= THEMES.length) go(k === '0' ? 9 : +k - 1);
  else if (k === 'ArrowRight') go(idx + 1);
  else if (k === 'ArrowLeft') go(idx - 1);
  else if (k === 'a' || k === 'A') setAuto(!auto);
  else if (k === 'f' || k === 'F') toggleFull();
  else return;
  wake();
}
addEventListener('keydown', onKey);

// ---- 滑鼠一動就顯示選單，閒置 2.5 秒隱藏（含游標）
let idleT;
// 點畫面切換選單；點到按鈕、選單本身時不切換
let lastTouch = 0, quietUntil = 0;
const interactive = (el) => !!(el && el.closest && el.closest('button, a, input, select, .seg, .dock, .fsbtn, [data-fx], .fx-back'));   // 圖表區不算：點一下照樣切換選單
function hideUi() {
  clearTimeout(idleT);
  dock.classList.remove('show'); $('help').classList.remove('show'); $('fsbtn').classList.remove('show'); document.body.classList.add('idle');
  quietUntil = Date.now() + 1200;   // 觸控點擊後瀏覽器會補送 mousemove，短時間內忽略，免得又被叫出來
}
function toggleUi() { dock.classList.contains('show') ? hideUi() : wake(); }
function onMove() { if (Date.now() > quietUntil) wake(); }
function onClick(e) { if (Date.now() - lastTouch < 800 || interactive(e.target)) return; toggleUi(); }

function wake() {
  dock.classList.add('show'); $('help').classList.add('show'); $('fsbtn').classList.add('show'); document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (!dock.matches(':hover') && !$('fsbtn').matches(':hover')) { dock.classList.remove('show'); $('help').classList.remove('show'); $('fsbtn').classList.remove('show'); document.body.classList.add('idle'); } else wake(); }, matchMedia('(hover: none)').matches ? 4000 : 2500);
}
addEventListener('mousemove', onMove);
addEventListener('click', onClick);

// ---- 長時間顯示：防休眠、整體微移防烙印
async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch { /* caffeinate 會處理 */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();
setInterval(() => { const r = () => Math.round((Math.random() - 0.5) * 6); stage.style.transform = `translate(${r()}px, ${r()}px)`; }, 180000);

// ---- 版本顯示與自動更新：線上版每 5 分鐘、或切回分頁時檢查，有新版就帶新版本號重新載入（繞過快取）
$('ver').textContent = DEPLOYED ? `${VERSION} · ${BUILT}` : 'local';
if (DEPLOYED) {
  if (store.get('ver', null) && store.get('ver', null) !== VERSION) setTimeout(() => toast(`已更新 ${VERSION}`), 600);
  store.set('ver', VERSION);
  const checkVersion = async () => {
    try {
      const j = await (await fetch('version.json', { cache: 'no-store' })).json();
      if (j.version && j.version !== VERSION) { const u = new URL(location.href); u.searchParams.set('v', j.version); location.replace(u.toString()); }
    } catch { /* 離線就下次再查 */ }
  };
  setTimeout(checkVersion, 3000);
  setInterval(checkVersion, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
}

go(idx, true);
document.body.classList.add('idle');
</script>
</body>
</html>
