<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500&family=Geist+Mono:wght@300;400&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #07080a; --fg: #eceae4; --mute: #5f6168; --up: #4bd3a7; --down: #ff5a3c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(circle at 33% 50%, #12141a 0%, var(--bg) 60%); color: var(--fg); overflow: hidden; font-family: 'Geist', 'Noto Sans TC', sans-serif; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; }
.col { position: fixed; left: var(--L, 55vw); right: 36px; top: 64px; bottom: 22px; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; container-type: size; }
.price { text-align: right; mix-blend-mode: difference; flex: none; }
.price .big { font-weight: 100; font-size: min(27vh, 400px, 29cqw); line-height: .9; letter-spacing: -.05em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.price .big small { font-size: .36em; font-weight: 200; letter-spacing: -.02em; }
.price .cap { font-family: 'Geist Mono'; font-size: 11px; letter-spacing: .3em; color: #8c8e95; text-transform: uppercase; margin-bottom: 8px; }
.chg { flex: none; margin: clamp(10px, 3vh, 30px) 4px 0 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px clamp(14px, 2.4cqw, 28px); align-items: baseline; font-family: 'Geist Mono'; font-size: 13px; color: var(--mute); white-space: nowrap; }
.chg .p { font-family: 'Geist'; font-weight: 300; font-size: clamp(26px, 5.4vh, 40px); letter-spacing: -.02em; }
.chg b { color: var(--fg); font-weight: 400; margin-left: 6px; }
.corner { position: fixed; left: 32px; top: 26px; font-family: 'Geist Mono'; font-size: 11px; letter-spacing: .28em; color: var(--mute); text-transform: uppercase; z-index: 2; }
.corner b { color: var(--fg); font-weight: 400; }
.legend { position: fixed; left: 32px; top: 52px; font-family: 'Geist Mono'; font-size: 10.5px; letter-spacing: .2em; color: var(--mute); text-transform: uppercase; z-index: 2; line-height: 1.9; }
@media (max-height: 760px) { .legend { font-size: 9.5px; letter-spacing: .14em; line-height: 1.75; } }
.legend i { display: inline-block; width: 18px; height: 1px; background: var(--fg); vertical-align: middle; margin-right: 10px; }
.orbs { flex: 1; min-height: 0; width: min(100%, 560px); margin-top: clamp(8px, 2.4vh, 24px); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
.orb { position: relative; container-type: size; min-height: 0; }
.orb > * { --s: min(100cqw, calc(100cqh - 22px), 150px); }
@media (min-height: 1100px) { .orbs { width: min(100%, 52vh); } .orb > * { --s: min(100cqw, calc(100cqh - 22px), 14vh); } }
.orb canvas { position: absolute; left: 50%; bottom: 22px; width: var(--s); height: var(--s); transform: translateX(-50%); }
.orb .in { position: absolute; left: 0; right: 0; bottom: 22px; height: var(--s); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.orb .px { font-weight: 300; font-size: max(13px, calc(var(--s) * .15)); letter-spacing: -.02em; white-space: nowrap; }
.orb .pc { font-family: 'Geist Mono'; font-size: max(9px, calc(var(--s) * .073)); margin-top: 2px; white-space: nowrap; }
.orb .nm { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 12px; font-weight: 500; color: #a9abb1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orb .nm small { font-family: 'Geist Mono'; font-size: 10px; color: var(--mute); margin-left: 6px; letter-spacing: .12em; }
.u { color: var(--up); } .d { color: var(--down); }
.xtra { margin-left: 14px; opacity: .85; white-space: nowrap; }

/* 直式：大軌道在上、價格與小軌道在下（位置由 JS 依軌道大小寫入 --T） */
@media (orientation: portrait) {
  .corner { right: 16px; left: 16px; top: 14px; line-height: 1.7; font-size: 10px; letter-spacing: .12em; }
  .corner .xtra { display: block; margin-left: 0; white-space: normal; letter-spacing: .06em; }
  .legend { left: 16px; right: 16px; top: auto; position: absolute; font-size: 9.5px; letter-spacing: .08em; line-height: 1.7; white-space: nowrap; overflow: hidden; }
  .legend i { width: 12px; margin-right: 7px; }
  .col { left: 16px; right: 16px; top: var(--T, 55vh); bottom: 14px; align-items: center; }
  .price { text-align: center; }
  .price .big { font-size: min(11vh, 200px, 21cqw); }
  .price .cap { margin-bottom: 4px; }
  .chg { justify-content: center; margin: 6px 0 0; gap: 4px 14px; }
  .chg .p { font-size: clamp(22px, 3.4vh, 40px); }
  .orbs { width: min(100%, 620px); }
}
@media (orientation: landscape) and (max-height: 500px) { .legend { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="corner"><b>Orbit</b> · BTC / USDT · TPE <b id="tpe">--</b> · NYC <b id="nyc">--</b> · <span id="xtra" class="xtra"></span></div>
<div class="col">
<div class="price"><div class="cap">Bitcoin · last trade</div><div class="big" id="price">—</div></div>
<div class="chg"><span class="p" id="pct">—</span><span>H<b id="h">—</b></span><span>L<b id="l">—</b></span><span>AMP<b id="amp">—</b></span></div>
<div class="orbs" id="orbs"></div>
</div>
<div class="legend" id="legend"><div><i></i>outer orbit · 4H closes · 30 days</div><div><i style="opacity:.5"></i>inner orbit · 1M candles · 60 minutes</div><div><i style="opacity:.25"></i>sweep · seconds</div><div><i style="opacity:.5"></i>orbs · line vs prev close · arc = day range</div></div>

<script src="feed.js?v=__VERSION__"></script>
<script src="draw.js?v=__VERSION__"></script>
<script src="fx.js?v=__VERSION__"></script>
<script>
const { S, fmt, pct } = Feed;
const $ = (id) => document.getElementById(id);
const UP = '#4bd3a7', DOWN = '#ff5a3c', FG = '#eceae4';
const cls = (v) => (v > 0 ? 'u' : v < 0 ? 'd' : '');
Feed.start({ '1m': 120, '4h': 180 });
Feed.mountExtras('#xtra');
Feed.on('mode', () => { if (Feed.mode === 'crypto') document.querySelectorAll('.legend div')[3].innerHTML = '<i style="opacity:.5"></i>orbs · line = recent history · arc = gauge (see label)'; });
const TAU = Math.PI * 2, GAP = 0.05;   // 頂端留一道縫代表「現在」
const ang = (i, n) => -Math.PI / 2 + TAU * GAP / 2 + (i / Math.max(1, n - 1)) * TAU * (1 - GAP);

// ---- 交互：滑過軌道依角度查那一根 K（內環 1 分、外環 4H）、點小軌道看詳情、大單漣漪從價格發出
const orbitGeo = {};
FX.theme({ bg: 'rgba(16,17,21,.94)', fg: '#eceae4', mute: '#8c8e95', line: 'rgba(236,234,228,.5)', accent: '#eceae4', up: '#4bd3a7', down: '#ff5a3c', sheet: '#101115', border: 'rgba(236,234,228,.1)', radius: '4px', font: "'Geist', 'Noto Sans TC', sans-serif" });
FX.inspect('#cv', (x, y) => {
  const g = orbitGeo; if (!g.R) return null;
  const dx = x - g.cx, dy = y - g.cy, r = Math.hypot(dx, dy);
  const ring = r > g.R * 0.3 && r < g.R * 0.69 ? g.inn : r >= g.R * 0.69 && r < g.R + 46 ? g.out : null;
  if (!ring) return null;
  let t = (Math.atan2(dy, dx) + Math.PI / 2 - TAU * GAP / 2) % TAU; if (t < 0) t += TAU;
  t /= TAU * (1 - GAP); if (t > 1) return null;   // 頂端的縫＝現在，沒有資料
  const n = ring.d.length, i = Math.round(t * (n - 1)), b = ring.d[i], a = ang(i, n), rr = ring.rad(b.c);
  return { x: g.cx + Math.cos(a) * rr, y: g.cy + Math.sin(a) * rr, vline: false, title: ring === g.inn ? FX.time(b.t, '1m') + ' · 1 分 K' : FX.time(b.t, '4h') + ' · 4H', rows: FX.rows(b) };
});
FX.events({ anchor: '#price', ax: 0.5, ay: 0.55, glow: '#price', shake: '.price' });

function orbit() {
  const { ctx, w, h } = Draw.fit($('cv'));
  let R, cx, cy;
  const root = document.documentElement.style, setVar = (k, v) => { if (root.getPropertyValue(k) !== v) root.setProperty(k, v); };
  if (h > w) {
    // 直式：圖例放在 corner 下方，軌道接在圖例下面置中，右欄移到軌道下方
    const lg = $('legend'), cb = document.querySelector('.corner').getBoundingClientRect().bottom;
    lg.style.top = (cb + 8) + 'px';
    const top = cb + 8 + lg.offsetHeight + 46;
    R = Math.max(60, Math.min(w * 0.40, (h - top - 40 - Math.max(340, h * 0.42)) / 2)); cx = w / 2; cy = top + R;   // 下方至少留 340px 給價格與小軌道
    setVar('--T', Math.round(cy + R + 40) + 'px');
  } else {
    R = Math.min(h * 0.43, w * 0.29); cx = Math.min(w * 0.31, R + 72); cy = h * 0.54;
    $('legend').style.top = '';
    setVar('--L', Math.round(cx + R + 56) + 'px');
  }
  cx += FX.pointer.x * 12; cy += FX.pointer.y * 9;   // 視差：軌道跟著滑鼠微動
  orbitGeo.cx = cx; orbitGeo.cy = cy; orbitGeo.R = R;
  // 刻度環：對齊外環 4H 資料，短刻度＝1 根 4H，長刻度＝1 天，標出天數
  ctx.save();
  const N4 = Math.min(180, (S.bars['4h'] || []).length || 180);
  for (let i = 0; i < N4; i++) {
    const a = ang(i, N4), back = N4 - 1 - i, long = back % 6 === 0;
    ctx.strokeStyle = long ? 'rgba(236,234,228,.55)' : 'rgba(236,234,228,.16)';
    ctx.lineWidth = long ? 1.4 : 1;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (R + 10), cy + Math.sin(a) * (R + 10)); ctx.lineTo(cx + Math.cos(a) * (R + (long ? 26 : 17)), cy + Math.sin(a) * (R + (long ? 26 : 17))); ctx.stroke();
    if (back > 0 && back % 60 === 0) {
      ctx.fillStyle = 'rgba(236,234,228,.6)'; ctx.font = '10px "Geist Mono"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`−${back / 6}d`, cx + Math.cos(a) * (R + 42), cy + Math.sin(a) * (R + 42));
    }
  }
  ctx.restore();

  // 秒針掃描
  const now = new Date(), sec = now.getSeconds() + now.getMilliseconds() / 1000;
  const sa = -Math.PI / 2 + sec / 60 * TAU;
  if (ctx.createConicGradient) {
    const g = ctx.createConicGradient(sa - 1.2, cx, cy);
    g.addColorStop(0, 'rgba(236,234,228,0)'); g.addColorStop(1.2 / TAU, 'rgba(236,234,228,.10)'); g.addColorStop(1.2 / TAU + 0.0001, 'rgba(236,234,228,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R + 8, sa - 1.2, sa); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(236,234,228,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx + Math.cos(sa) * R * 0.2, cy + Math.sin(sa) * R * 0.2); ctx.lineTo(cx + Math.cos(sa) * (R + 30), cy + Math.sin(sa) * (R + 30)); ctx.stroke();

  // 外環：30 天 4H 收盤，半徑＝價格
  const b4 = S.bars['4h'];
  if (b4 && b4.length > 10) {
    const d = b4.slice(-180);
    let hi = -Infinity, lo = Infinity; for (const b of d) { hi = Math.max(hi, b.c); lo = Math.min(lo, b.c); }
    const r0 = R * 0.72, r1 = R;
    const rad = (p) => r0 + (p - lo) / (hi - lo || 1) * (r1 - r0);
    orbitGeo.out = { d, rad };
    ctx.beginPath();
    d.forEach((b, i) => { const a = ang(i, d.length), r = rad(b.c); i ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); });
    for (let i = d.length - 1; i >= 0; i--) { const a = ang(i, d.length); ctx.lineTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); }
    ctx.closePath();
    const rg = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);
    rg.addColorStop(0, 'rgba(236,234,228,0)'); rg.addColorStop(1, 'rgba(236,234,228,.09)');
    ctx.fillStyle = rg; ctx.fill();
    ctx.beginPath();
    d.forEach((b, i) => { const a = ang(i, d.length), r = rad(b.c); i ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); });
    ctx.strokeStyle = FG; ctx.lineWidth = 1.4; ctx.stroke();
    // 每天一條徑向細線
    ctx.strokeStyle = 'rgba(236,234,228,.07)';
    d.forEach((b, i) => { if (i % 6) return; const a = ang(i, d.length); ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0 * 0.98, cy + Math.sin(a) * r0 * 0.98); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke(); });
    const la = ang(d.length - 1, d.length), lr = rad(d[d.length - 1].c);
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 14; ctx.shadowColor = '#fff';
    ctx.beginPath(); ctx.arc(cx + Math.cos(la) * lr, cy + Math.sin(la) * lr, 3.5, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }

  // 內環：60 根 1 分 K，徑向 K 棒
  const b1 = S.bars['1m'];
  if (b1 && b1.length > 10) {
    const d = b1.slice(-60);
    let hi = -Infinity, lo = Infinity; for (const b of d) { hi = Math.max(hi, b.h); lo = Math.min(lo, b.l); }
    const r0 = R * 0.36, r1 = R * 0.66;
    const rad = (p) => r0 + (p - lo) / (hi - lo || 1) * (r1 - r0);
    orbitGeo.inn = { d, rad };
    ctx.strokeStyle = 'rgba(236,234,228,.08)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r0 - 6, 0, TAU); ctx.stroke();
    d.forEach((b, i) => {
      const a = ang(i, d.length), up = b.c >= b.o, c = Math.cos(a), s = Math.sin(a);
      ctx.strokeStyle = up ? UP : DOWN;
      ctx.lineWidth = 1; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.moveTo(cx + c * rad(b.l), cy + s * rad(b.l)); ctx.lineTo(cx + c * rad(b.h), cy + s * rad(b.h)); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = Math.max(2, (TAU * r0 / 60) * 0.55);
      const o = rad(Math.min(b.o, b.c)), e = Math.max(o + 1.5, rad(Math.max(b.o, b.c)));
      ctx.beginPath(); ctx.moveTo(cx + c * o, cy + s * o); ctx.lineTo(cx + c * e, cy + s * e); ctx.stroke();
    });
    const lb = d[d.length - 1], la = ang(d.length - 1, d.length), lr = rad(lb.c);
    const pulse = (Date.now() % 1500) / 1500;
    ctx.strokeStyle = `rgba(255,255,255,${1 - pulse})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx + Math.cos(la) * lr, cy + Math.sin(la) * lr, 4 + pulse * 18, 0, TAU); ctx.stroke();
  }

  // 中心：現在的縫與標記
  ctx.fillStyle = 'rgba(236,234,228,.85)'; ctx.font = '10px "Geist Mono"'; ctx.textAlign = 'center';
  ctx.fillText('NOW', cx, cy - R - 40);
  ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(236,234,228,.25)'; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(cx, cy - R * 0.3); ctx.lineTo(cx, cy - R - 32); ctx.stroke(); ctx.setLineDash([]);
}

let shown = '';
function drawPrice() {
  if (S.price == null) return;
  const s = fmt(S.price);
  if (s === shown) return;
  shown = s;
  const [i, d] = s.split('.');
  $('price').innerHTML = `${i}<small>.${d}</small>`;
  document.title = s + ' · BTC';
}
Feed.on('ticker', () => {
  const t = S.ticker;
  $('pct').textContent = pct(t.P); $('pct').className = 'p ' + cls(t.P);
  $('h').textContent = fmt(t.h, 0); $('l').textContent = fmt(t.l, 0);
  $('amp').textContent = ((t.h - t.l) / t.o * 100).toFixed(2) + '%';
});

const orbs = {};
Feed.on('markets', () => {
  S.markets.forEach((s) => {
    let o = orbs[s.id];
    if (!o) {
      const el = document.createElement('div');
      el.className = 'orb'; el.dataset.fx = s.id;
      el.innerHTML = `<canvas></canvas><div class="in"><div class="px">—</div><div class="pc">—</div></div><div class="nm">${s.name}<small>${s.code}</small></div>`;
      $('orbs').appendChild(el);
      o = orbs[s.id] = { el, q: (x) => el.querySelector(x) };
    }
    if (s.price == null) return;
    o.q('.px').textContent = Feed.val(s);
    o.q('.pc').textContent = Feed.chgTxt(s); o.q('.pc').className = 'pc ' + cls(s.chg);
    // 迷你軌道：整個交易時段一圈，半徑＝相對昨收
    const { ctx, w, h } = Draw.fit(o.q('canvas'));
    const cx = w / 2, cy = h / 2, R = w * 0.35, slots = Feed.slots(s);
    const bars = s.bars || [];
    ctx.strokeStyle = 'rgba(236,234,228,.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    if (!bars.length || s.prevClose == null) return;
    const maxAbs = Math.max(...bars.map((b) => Math.abs(b.c - s.prevClose)), 1e-12);
    const a = (i) => -Math.PI / 2 + i / slots * TAU;
    const r = (p) => R + (p - s.prevClose) / maxAbs * w * 0.1;
    ctx.beginPath();
    bars.forEach((b, i) => { const x = cx + Math.cos(a(i)) * r(b.c), y = cy + Math.sin(a(i)) * r(b.c); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = s.chg >= 0 ? UP : DOWN; ctx.lineWidth = 1.5; ctx.stroke();
    const li = bars.length - 1;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + Math.cos(a(li)) * r(bars[li].c), cy + Math.sin(a(li)) * r(bars[li].c), 2.5, 0, TAU); ctx.fill();
    // 振幅弧
    ctx.strokeStyle = 'rgba(236,234,228,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, w * 0.48, -Math.PI / 2, -Math.PI / 2 + Math.min(1, s.amp / 5) * TAU); ctx.stroke();
  });
});

function clocks() { $('tpe').textContent = Feed.tzNow('Asia/Taipei').str; $('nyc').textContent = Feed.tzNow('America/New_York').str; }
setInterval(clocks, 1000); clocks();

function frame() { drawPrice(); orbit(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
