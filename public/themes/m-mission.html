<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #262725; --deep: #1c1d1b; --sage: #b9d4c2; --sage2: #a2c1ad; --orange: #f26a3d; --ink: #1c1d1b; --fg: #e6eee8; --mute: #858c86; --line: #3a3c39; --up: #f26a3d; --down: #b9d4c2; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: 'Inter Tight', 'Noto Sans TC', sans-serif; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.wrap { height: 100vh; display: grid; grid-template-rows: 40px clamp(120px, 20vh, 182px) clamp(92px, 14.5vh, 132px) minmax(0, 1fr) clamp(80px, 12.5vh, 112px); gap: 12px; padding: 0 34px 22px; }
.top { display: flex; align-items: center; gap: 12px; font-family: 'IBM Plex Mono'; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--sage); }
.top i { width: 16px; height: 16px; border-radius: 50%; background: var(--sage); display: grid; place-items: center; color: var(--ink); font-style: normal; font-size: 10px; }
.top .sp { margin-left: auto; color: var(--sage); }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 21vw, 300px) clamp(200px, 21vw, 300px); gap: 14px; align-items: stretch; }
.title { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 6px; }
.price { font-weight: 800; font-size: min(15.5vh, 146px); line-height: .88; letter-spacing: -.045em; color: var(--sage); white-space: nowrap; font-variant-numeric: tabular-nums; }
.price small { font-size: .38em; letter-spacing: -.02em; color: var(--sage2); }
.sub { font-weight: 700; font-size: 22px; color: var(--sage); margin-top: 8px; letter-spacing: -.01em; }
.sub span { color: var(--mute); font-weight: 500; font-size: 15px; margin-left: 12px; letter-spacing: 0; }
.box { position: relative; border-radius: 6px; padding: 14px 16px 12px; color: var(--ink); display: flex; flex-direction: column; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08), 0 10px 30px rgba(0,0,0,.25); }
.box.sage { background: var(--sage); } .box.orange { background: var(--orange); }
.box .meter { position: relative; height: 8px; margin: -2px 0 8px; background: rgba(28,29,27,.15); }
.box .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(-45deg, var(--ink) 0 5px, transparent 5px 10px); transition: width .8s; }
.box .lab { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono'; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
.box .big { font-weight: 800; font-size: clamp(30px, 6.4vh, 58px); letter-spacing: -.04em; line-height: 1; margin-top: auto; font-variant-numeric: tabular-nums; }
.box .row { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 6px; font-weight: 700; font-size: 17px; }
.box .row small { font-family: 'IBM Plex Mono'; font-size: 10px; font-weight: 500; text-transform: uppercase; }
.box .bar { position: absolute; right: 16px; top: 34px; width: 78px; height: 26px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); opacity: .8; }

.tl { position: relative; border-top: 2px solid var(--sage); border-bottom: 2px solid var(--sage); padding: 10px 0 0; }
.tl .ph { position: absolute; top: 8px; font-weight: 600; font-size: 14px; }
.tl .ph.a { color: var(--orange); } .tl .ph.b { color: var(--sage); }
.tl .rail { position: absolute; left: 0; right: 0; top: 34px; height: 7px; }
.tl .rail i { position: absolute; top: 0; height: 100%; }
.tl .axis { position: absolute; left: 0; right: 0; top: 50px; bottom: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.tl .tk { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--mute); padding: 0 0 3px 4px; display: flex; align-items: flex-end; }
.tl .blk { position: absolute; top: 24px; height: 32px; display: flex; align-items: center; padding: 0 10px; font-family: 'IBM Plex Mono'; font-size: 13px; color: var(--ink); font-weight: 500; }
.tl .blk.a { background: var(--orange); } .tl .blk.b { background: var(--sage); }
.tl .blk.btc { top: 62px; height: 22px; background: repeating-linear-gradient(-45deg, rgba(242,106,61,.35) 0 6px, rgba(242,106,61,.12) 6px 12px); color: var(--orange); border: 1px solid var(--orange); }
.tl .note { position: absolute; top: 92px; font-family: 'Noto Sans TC'; font-size: 11.5px; font-weight: 500; padding-left: 8px; border-left: 1px dashed currentColor; line-height: 1.4; }
.tl .note.a { color: var(--orange); } .tl .note.b { color: var(--sage); }
.tl .now { position: absolute; top: 24px; bottom: 0; width: 2px; background: var(--fg); z-index: 2; }
.tl .now b { position: absolute; top: -18px; left: -26px; width: 54px; text-align: center; font-family: 'IBM Plex Mono'; font-size: 10.5px; background: var(--fg); color: var(--ink); padding: 1px 0; font-weight: 500; }

.win { position: relative; background: #121311; border-radius: 22px; border: 6px solid #2f312e; box-shadow: inset 0 0 0 1px #000, 0 20px 50px rgba(0,0,0,.4); overflow: hidden; min-height: 0; }
.win::before, .win::after { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #3d3f3c; box-shadow: inset 0 1px 0 #5a5d59; top: 4px; left: 14px; z-index: 3; }
.win::after { left: auto; right: 14px; }
.band { position: absolute; left: 0; right: 0; top: 16px; height: 52px; background: var(--orange); color: var(--ink); display: grid; grid-template-columns: 210px repeat(3, auto) 1fr; align-items: center; z-index: 2; padding: 0 22px; gap: 0; }
.band b { font-weight: 800; font-size: 21px; line-height: .95; letter-spacing: -.02em; }
.band .cell { display: flex; align-items: baseline; gap: 8px; padding: 0 22px; border-left: 2px solid var(--ink); height: 38px; flex-direction: column; justify-content: center; }
.band .cell strong { font-weight: 800; font-size: 25px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.band .cell small { font-family: 'IBM Plex Mono'; font-size: 10px; text-transform: uppercase; }
.win canvas { position: absolute; left: 14px; right: 14px; top: 76px; bottom: 16px; width: calc(100% - 28px); height: calc(100% - 92px); }
.win .hz2 { position: absolute; left: 40%; right: 40%; bottom: 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--orange) 0 6px, transparent 6px 12px); opacity: .7; }

.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile { border-radius: 6px; padding: 10px 14px; display: grid; grid-template-rows: auto auto 1fr auto; color: var(--ink); min-width: 0; position: relative; overflow: hidden; }
.tile:nth-child(3n+1) { background: var(--orange); } .tile:nth-child(3n+2) { background: var(--sage); } .tile:nth-child(3n) { background: #3a3d39; color: var(--fg); }
.tile .lab { font-family: 'IBM Plex Mono'; font-size: 10px; text-transform: uppercase; display: flex; justify-content: space-between; }
.tile .nm { font-weight: 700; font-size: 17px; margin-top: 2px; white-space: nowrap; font-family: 'Inter Tight', 'Noto Sans TC'; }
.tile .pc { font-weight: 800; font-size: clamp(22px, 3.4vh, 30px); letter-spacing: -.04em; line-height: 1; align-self: end; font-variant-numeric: tabular-nums; }
.tile .px { font-family: 'IBM Plex Mono'; font-size: 12px; display: flex; justify-content: space-between; margin-top: 4px; }
.tile canvas { position: absolute; right: 10px; top: 30px; width: 84px; height: 30px; opacity: .85; }
@media (max-height: 720px) {
  .tl .note { display: none; }
  .tl .blk { height: 30px; top: 22px; font-size: 11px; } .tl .blk.btc { top: 58px; height: 20px; }
  .band { top: 14px; height: 46px; grid-template-columns: 150px repeat(3, auto) 1fr; }
  .band b { font-size: 18px; } .band .cell { height: 34px; padding: 0 14px; } .band .cell strong { font-size: 21px; }
  .win canvas { top: 66px; bottom: 16px; height: calc(100% - 82px); }
  .win::before, .win::after { display: none; }
  .tile .pc { font-size: 24px; } .tile canvas { display: none; } .tile .nm { font-size: 14px; }
}
@media (max-height: 640px) {
  .wrap { grid-template-rows: 40px clamp(120px, 23vh, 206px) minmax(0, 1fr) clamp(84px, 14vh, 128px); }
  .tl { display: none; }
}
.xtra { margin-left: 14px; opacity: .85; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><i>◈</i><span>Mission Control Dashboard · BTC / USDT</span><span id="xtra" class="xtra"></span><span class="sp" id="date">—</span></div>
  <section class="hero">
    <div class="title"><div class="price" id="price">—</div><div class="sub">Bitcoin Expedition<span>Binance spot · live telemetry</span></div></div>
    <div class="box sage"><div class="meter"><i id="mPos"></i></div><div class="lab"><span>24H High</span><span id="mPosT">—</span></div>
      <div class="big" id="h">—</div><div class="row"><span>⊠ <span id="l">—</span></span><small>24H Low</small></div></div>
    <div class="box orange"><div class="meter"><i id="mAmp"></i></div><div class="lab"><span>24H Change</span><span id="mAmpT">—</span></div>
      <div class="big" id="pct">—</div><div class="row"><span>⊠ <span id="amp">—</span></span><small>Amplitude</small></div></div>
  </section>
  <section class="tl" id="tl"></section>
  <section class="win">
    <div class="band"><b>BTC 1-Min<br>Dynamics</b>
      <div class="cell"><strong id="clk">—</strong><small>Taipei time</small></div>
      <div class="cell"><strong id="rate">—</strong><small>Trades / sec</small></div>
      <div class="cell"><strong id="flow">—</strong><small>Buy share · 60s</small></div>
      <div class="cell" style="justify-self:end;border:0"><small id="ohlc">—</small></div></div>
    <canvas id="c1m"></canvas>
  </section>
  <section class="tiles" id="tiles"></section>
</div>

<script src="feed.js"></script>
<script src="draw.js"></script>
<script>
const { S, fmt, pct } = Feed;
const $ = (id) => document.getElementById(id);
Feed.start({ '1m': 150, '4h': 90 });
Feed.mountExtras('#xtra');

// ---- 交易時段甘特圖（台北時間 24 小時軸）
// 沒有股票資料時（加密模式）用時鐘判斷是否開盤（不含假日）
function clockOpen(t, o, c) { const h = +t.hh + +t.mm / 60; return !['Sat', 'Sun'].includes(t.wd) && h >= o && h < c; }
function timeline() {
  const el = $('tl');
  const tp = Feed.tzNow('Asia/Taipei'), ny = Feed.tzNow('America/New_York');
  const diff = ((+tp.hh - +ny.hh) + 24) % 24;          // 台北比紐約快幾小時（夏令 12、冬令 13）
  const nowH = +tp.hh + +tp.mm / 60;
  const pctX = (h) => (h / 24 * 100) + '%';
  const usOpen = 9.5 + diff, usClose = 16 + diff;      // 換成台北時間，會跨午夜
  let html = '<div class="ph a" style="left:0">Phase 1 · Asia Session</div><div class="ph b" style="left:' + pctX(Math.min(19.2, usOpen % 24)) + '">Phase 2 · US Session</div>';
  html += `<div class="axis">${Array.from({ length: 8 }, (_, i) => `<div class="tk" style="left:${pctX(i * 3)}">${String(i * 3).padStart(2, '0')}</div>`).join('')}</div>`;
  html += `<div class="blk a" style="left:${pctX(9)};width:${(4.5 / 24 * 100)}%">◎ TWSE 09:00–13:30</div>`;
  const segs = usClose > 24 ? [[usOpen, 24], [0, usClose - 24]] : [[usOpen, usClose]];
  segs.forEach(([a, b], k) => { html += `<div class="blk b" style="left:${pctX(a)};width:${((b - a) / 24 * 100)}%">${k ? '' : '⚑ NYSE · NASDAQ'}</div>`; });
  html += `<div class="blk btc" style="left:0;width:100%">BTC · 24 / 7 · always on</div>`;
  const tw = S.markets.find((m) => m.market === 'TW'), us = S.markets.find((m) => m.market === 'US');
  html += `<div class="note a" style="left:${pctX(9)}">台股 ${(tw ? tw.isOpen : clockOpen(tp, 9, 13.5)) ? '交易中' : '休市'}${tw ? `<br>加權 ${pct(tw.pct)}` : ''}</div>`;
  html += `<div class="note b" style="left:${pctX(Math.min(21, usOpen % 24))}">美股 ${(us ? us.isOpen : clockOpen(ny, 9.5, 16)) ? '交易中' : '休市'}${us ? `<br>SPY ${pct(us.pct)}` : ''}</div>`;
  html += `<div class="now" style="left:${pctX(nowH)}"><b>${tp.hh}:${tp.mm}</b></div>`;
  el.innerHTML = html;
}

let shown = '';
function drawPrice() {
  if (S.price == null) return;
  const s = fmt(S.price);
  if (s === shown) return;
  shown = s;
  const [i, d] = s.split('.');
  $('price').innerHTML = `${i}<small>.${d}</small>`;
  document.title = s + ' · BTC';
}
Feed.on('ticker', () => {
  const t = S.ticker;
  $('h').textContent = fmt(t.h, 0); $('l').textContent = fmt(t.l, 0);
  $('pct').textContent = pct(t.P); $('amp').textContent = ((t.h - t.l) / t.o * 100).toFixed(2) + '%';
  // 警示條＝真的進度：綠牌是現價在 24H 區間的位置，橘牌是 24H 振幅（滿格 6%）
  const pos = S.price ? Math.max(0, Math.min(1, (S.price - t.l) / (t.h - t.l || 1))) : 0, ampv = (t.h - t.l) / t.o * 100;
  $('mPos').style.width = pos * 100 + '%'; $('mPosT').textContent = 'range pos ' + Math.round(pos * 100) + '%';
  $('mAmp').style.width = Math.min(100, ampv / 6 * 100) + '%'; $('mAmpT').textContent = 'amp ' + ampv.toFixed(2) + '% / 6%';
});

const tiles = {};
Feed.on('markets', () => {
  S.markets.forEach((s) => {
    let c = tiles[s.id];
    if (!c) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.innerHTML = `<div class="lab"><span>${Feed.venue(s)} · ${s.code}</span><span class="st"></span></div><div class="nm">${s.name.replace(' ETF', '')}</div><div class="pc">—</div><div class="px"><span class="p">—</span><span class="a">—</span></div><canvas></canvas>`;
      $('tiles').appendChild(el);
      c = tiles[s.id] = { el, q: (x) => el.querySelector(x) };
    }
    if (s.price == null) return;
    c.q('.st').textContent = s.isOpen ? '● LIVE' : 'HOLD';
    const cr = s.market === 'CR';
    c.q('.pc').textContent = cr ? Feed.val(s) : Feed.chgTxt(s);
    c.q('.p').textContent = cr ? Feed.chgTxt(s) : Feed.val(s); c.q('.a').textContent = Feed.sub(s, 'AMP');
    const dark = getComputedStyle(c.el).color !== 'rgb(28, 29, 27)';
    Draw.spark(c.q('canvas'), s.bars, { mode: 'line', slots: Feed.slots(s), base: s.prevClose, line: dark ? '#e6eee8' : '#1c1d1b', lineWidth: 1.6, baseColor: dark ? 'rgba(230,238,232,.35)' : 'rgba(28,29,27,.35)', baseDash: [2, 3] });
  });
});

function charts() {
  const r = Draw.candles($('c1m'), S.bars['1m'], { count: 80, headroom: 0.04, footroom: 0.04, pad: { t: 6, r: 70, b: 6, l: 6 }, up: '#f26a3d', down: '#b9d4c2', body: 0.62,
    grid: { color: 'rgba(185,212,194,.07)', rows: 4, cols: 12 }, ema: [{ n: 20, color: 'rgba(230,238,232,.7)', width: 1.3 }],
    lastLine: { color: 'rgba(242,106,61,.7)', dash: [3, 4], full: true }, axis: { font: '11px "IBM Plex Mono"', color: '#858c86', ticks: 4, fmt: (v) => fmt(v, 0) } });
  if (r) {
    const ctx = $('c1m').getContext('2d');
    ctx.fillStyle = '#f26a3d'; ctx.fillRect(r.w - 66, r.last.y - 10, 66, 20);
    ctx.fillStyle = '#1c1d1b'; ctx.font = '500 11px "IBM Plex Mono"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(fmt(r.last.c, 1), r.w - 33, r.last.y + 1);
    const b = S.bars['1m'][S.bars['1m'].length - 1];
    $('ohlc').textContent = `O ${fmt(b.o)} · H ${fmt(b.h)} · L ${fmt(b.l)} · C ${fmt(b.c)}`;
  }
  const now = Date.now(); let bu = 0, se = 0, n = 0;
  for (const x of S.ticks) { if (x.T < now - 60000) continue; n++; if (x.m) se += x.q; else bu += x.q; }
  $('rate').textContent = (n / 60).toFixed(1); $('flow').textContent = bu + se ? Math.round(bu / (bu + se) * 100) + '%' : '—';
}

function clocks() {
  const tp = Feed.tzNow('Asia/Taipei');
  $('clk').textContent = `${tp.hh}:${tp.mm}`;
  $('date').textContent = new Date().toLocaleDateString('en-US', { timeZone: 'Asia/Taipei', month: 'long', day: 'numeric', year: 'numeric' }) + ' · TPE ' + tp.str + ' · NYC ' + Feed.tzNow('America/New_York').str;
  timeline();
}
setInterval(clocks, 1000); clocks();

let last = 0;
function frame(t) { drawPrice(); if (t - last > 250) { last = t; charts(); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
