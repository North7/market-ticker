<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #0a0a0c; --lane: #131316; --lane2: #1a1a1e; --fg: #f1efeb; --mute: #6d6c72; --line: #222226; --buy: #ff6a4d; --sell: #3fd8c0; --up: #ff6a4d; --down: #3fd8c0; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: 'Manrope', 'Noto Sans TC', sans-serif; }
.wrap { height: 100vh; display: grid; grid-template-rows: 40px 196px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 392px; column-gap: 18px; padding: 0 28px 24px; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; font-family: 'DM Mono'; font-size: 11px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; border-bottom: 1px solid var(--line); }
.top .rec { color: var(--buy); display: flex; align-items: center; gap: 8px; font-weight: 500; }
.top .rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--buy); box-shadow: 0 0 10px var(--buy); animation: bl 1.2s infinite; }
@keyframes bl { 50% { opacity: .25; } }
.top b { color: var(--fg); font-weight: 500; }
.top .sp { margin-left: auto; }
.hero { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; padding-bottom: 14px; }
.price { font-weight: 200; font-size: min(22vh, 196px); line-height: .88; letter-spacing: -.055em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.price small { font-size: .34em; font-weight: 300; color: var(--mute); letter-spacing: -.02em; }
.stats { display: flex; gap: 30px; padding-bottom: 12px; }
.stats div { text-align: right; }
.stats span { display: block; font-family: 'DM Mono'; font-size: 10.5px; letter-spacing: .16em; color: var(--mute); }
.stats b { font-weight: 300; font-size: 30px; letter-spacing: -.02em; }
.left { display: grid; grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr) 118px; gap: 12px; min-height: 0; min-width: 0; }
.lane { position: relative; background: var(--lane); border-radius: 14px; overflow: hidden; min-height: 0; border: 1px solid #1d1d21; }
.lane .hd { position: absolute; left: 0; top: 0; bottom: 0; width: 132px; padding: 14px 16px; background: var(--lane2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.lane .hd b { font-size: 14px; font-weight: 600; }
.lane .hd span { font-family: 'DM Mono'; font-size: 10.5px; color: var(--mute); letter-spacing: .08em; line-height: 1.6; }
.lane .hd .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lane .hd .knobs { margin-top: auto; display: flex; gap: 8px; }
.lane .hd .knobs i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3a3a40, #1b1b1f); border: 1px solid #2c2c31; position: relative; }
.lane .hd .knobs i::after { content: ''; position: absolute; left: 10px; top: 3px; width: 2px; height: 7px; background: var(--fg); border-radius: 1px; transform-origin: 1px 8px; transform: rotate(var(--r, 30deg)); }
.lane canvas { position: absolute; left: 132px; right: 0; top: 0; bottom: 0; width: calc(100% - 132px); height: 100%; }
.mixer { grid-row: 3; grid-column: 2; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; background: var(--lane); border: 1px solid #1d1d21; border-radius: 14px; padding: 14px 10px; min-height: 0; }
.ch { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; justify-items: center; gap: 6px; min-height: 0; }
.ch .cd { font-family: 'DM Mono'; font-size: 10.5px; color: var(--mute); letter-spacing: .06em; }
.ch .cd.on { color: var(--buy); }
.ch .nm { font-family: 'Noto Sans TC'; font-size: 11.5px; font-weight: 500; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.ch .body { position: relative; width: 100%; display: flex; justify-content: center; gap: 7px; min-height: 0; }
.meter { width: 7px; display: flex; flex-direction: column-reverse; gap: 2px; }
.meter i { flex: 1; border-radius: 1px; background: #26262b; }
.fader { position: relative; width: 6px; border-radius: 3px; background: #050506; box-shadow: inset 0 0 0 1px #2a2a2f; }
.fader .cap { position: absolute; left: 50%; width: 30px; height: 16px; margin: -8px 0 0 -15px; border-radius: 3px; background: linear-gradient(180deg, #d9d9dc, #8e8e93 48%, #5c5c61 52%, #a5a5aa); box-shadow: 0 4px 10px rgba(0, 0, 0, .6); transition: top .8s cubic-bezier(.2, .9, .25, 1); }
.fader .cap::after { content: ''; position: absolute; left: 3px; right: 3px; top: 7px; height: 2px; background: #111; }
.ch .px { font-size: 15px; font-weight: 500; letter-spacing: -.02em; }
.ch .pc { font-family: 'DM Mono'; font-size: 11px; }
.u { color: var(--up); } .d { color: var(--down); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="rec"><i></i>REC <span id="rt">00:00:00</span></span><span>BTC / USDT · Binance spot</span><span>1 bar = 1 second · ▲ taker buy ▼ taker sell</span>
    <span class="sp">TPE <b id="tpe">—</b></span><span>NYC <b id="nyc">—</b></span></div>
  <div class="hero">
    <div class="price" id="price">—</div>
    <div class="stats"><div><span>24H</span><b id="pct">—</b></div><div><span>HIGH</span><b id="h">—</b></div><div><span>LOW</span><b id="l">—</b></div><div><span>BUY · 60S</span><b id="flow">—</b></div></div>
  </div>
  <div class="left">
    <div class="lane"><div class="hd"><b>Order Flow</b><span><i class="sw" style="background:var(--buy)"></i>買 BUY<br><i class="sw" style="background:var(--sell)"></i>賣 SELL<br>180 s window</span><div class="knobs"><i style="--r:-40deg"></i><i style="--r:20deg"></i></div></div><canvas id="wave"></canvas></div>
    <div class="lane"><div class="hd"><b>Track 1</b><span>BTC · 1 MIN<br>EMA 20<br><b id="o1" style="font-size:12px;color:var(--fg)">—</b></span><div class="knobs"><i style="--r:10deg"></i><i style="--r:-60deg"></i></div></div><canvas id="c1m"></canvas></div>
    <div class="lane"><div class="hd"><b>Track 2</b><span>BTC · 4 HOUR<br>30 days<br><b id="o4" style="font-size:12px;color:var(--fg)">—</b></span></div><canvas id="c4h"></canvas></div>
  </div>
  <div class="mixer" id="mixer"></div>
</div>

<script src="../feed.js"></script>
<script src="../draw.js"></script>
<script>
const { S, fmt, pct } = Feed;
const $ = (id) => document.getElementById(id);
const BUY = '#ff6a4d', SELL = '#3fd8c0';
const cls = (v) => (v > 0 ? 'u' : v < 0 ? 'd' : '');
Feed.start({ '1m': 160, '4h': 180 });
const t0 = Date.now();

function wave() {
  const { ctx, w, h } = Draw.fit($('wave'));
  const N = 180, now = Date.now(), endS = Math.floor(now / 1000);
  const buy = new Float64Array(N), sell = new Float64Array(N);
  for (const x of S.ticks) {
    const k = N - 1 - (endS - Math.floor(x.T / 1000));
    if (k < 0 || k >= N) continue;
    if (x.m) sell[k] += x.q; else buy[k] += x.q;
  }
  const all = [...buy, ...sell].map(Math.sqrt).filter((v) => v > 0).sort((a, b) => a - b);
  const ref = all[Math.floor(all.length * 0.95)] || 1;
  const mid = h / 2, maxH = h / 2 - 14, bw = (w - 30) / N;
  // 時間尺
  ctx.fillStyle = '#6d6c72'; ctx.font = '10px "DM Mono"'; ctx.textAlign = 'center';
  for (let s = 0; s <= N; s += 30) { const x = 10 + (N - s) * bw; ctx.fillRect(x, 0, 1, 6); ctx.fillText(s ? `-${s}s` : 'now', x, 16); }
  ctx.fillStyle = 'rgba(241,239,235,.12)'; ctx.fillRect(10, mid, w - 20, 1);
  for (let k = 0; k < N; k++) {
    const x = 10 + k * bw, live = k === N - 1;
    const hb = Math.min(1.15, Math.sqrt(buy[k]) / ref) * maxH, hs = Math.min(1.15, Math.sqrt(sell[k]) / ref) * maxH;
    const a = 0.35 + 0.65 * (k / N);
    ctx.fillStyle = live ? '#fff' : `rgba(255,106,77,${a})`;
    ctx.beginPath(); ctx.roundRect(x, mid - Math.max(1.5, hb) - 1, Math.max(1.5, bw * 0.62), Math.max(1.5, hb), 1.5); ctx.fill();
    ctx.fillStyle = live ? '#fff' : `rgba(63,216,192,${a})`;
    ctx.beginPath(); ctx.roundRect(x, mid + 1, Math.max(1.5, bw * 0.62), Math.max(1.5, hs), 1.5); ctx.fill();
  }
  // 播放頭
  const px = 10 + (N - 1) * bw + bw * 0.31;
  ctx.fillStyle = BUY; ctx.fillRect(px, 20, 1.5, h - 24);
  ctx.beginPath(); ctx.moveTo(px - 5, 20); ctx.lineTo(px + 6.5, 20); ctx.lineTo(px + 0.75, 27); ctx.fill();
  let b60 = 0, s60 = 0; for (let k = N - 60; k < N; k++) { b60 += buy[k]; s60 += sell[k]; }
  $('flow').textContent = b60 + s60 ? Math.round(b60 / (b60 + s60) * 100) + '%' : '—';
}

function charts() {
  const r = Draw.candles($('c1m'), S.bars['1m'], { count: 160, pad: { t: 10, r: 64, b: 10, l: 10 }, up: BUY, down: SELL, body: 0.6,
    grid: { color: 'rgba(241,239,235,.05)', rows: 3, cols: 16 }, ema: [{ n: 20, color: 'rgba(241,239,235,.6)', width: 1.2 }],
    lastLine: { color: 'rgba(241,239,235,.4)', dash: [2, 4], full: true }, axis: { font: '10px "DM Mono"', color: '#6d6c72', ticks: 3, fmt: (v) => fmt(v, 0) } });
  if (r) $('o1').textContent = fmt(r.last.c, 1);
  const r4 = Draw.candles($('c4h'), S.bars['4h'], { mode: 'area', count: 180, pad: { t: 10, r: 64, b: 10, l: 10 }, rightGap: 0, line: '#f1efeb', lineWidth: 1.3,
    areaTop: 'rgba(241,239,235,.14)', areaBottom: 'rgba(241,239,235,0)', axis: { font: '10px "DM Mono"', color: '#6d6c72', ticks: 2, fmt: (v) => fmt(v, 0) } });
  if (r4) { const b = S.bars['4h'], lb = b[b.length - 1]; $('o4').textContent = pct((lb.c - lb.o) / lb.o * 100); }
}

const strips = {};
Feed.on('markets', () => {
  S.markets.forEach((s) => {
    let c = strips[s.id];
    if (!c) {
      const el = document.createElement('div');
      el.className = 'ch';
      el.innerHTML = `<span class="cd">${s.code}</span><span class="nm">${s.name.replace(' ETF', '').replace('Nasdaq 100', 'NDX 100')}</span>
        <div class="body"><div class="meter">${'<i></i>'.repeat(16)}</div><div class="fader"><div class="cap"></div></div><div class="meter">${'<i></i>'.repeat(16)}</div></div>
        <span class="px">—</span><span class="pc">—</span>`;
      $('mixer').appendChild(el);
      c = strips[s.id] = { el, q: (x) => el.querySelector(x) };
    }
    if (s.price == null) return;
    const cd = c.q('.cd'); cd.textContent = (s.isOpen ? '● ' : '') + s.code; cd.className = 'cd' + (s.isOpen ? ' on' : '');
    c.q('.px').textContent = fmt(s.price, s.dec);
    c.q('.pc').textContent = pct(s.pct); c.q('.pc').className = 'pc ' + cls(s.chg);
    // 推桿＝當日區間位置；LED 表＝漲跌幅（滿格 ±4%）
    c.q('.cap').style.top = (1 - s.pos) * 100 + '%';
    const lit = Math.round(Math.min(1, Math.abs(s.pct) / 4) * 16);
    c.el.querySelectorAll('.meter').forEach((m) => [...m.children].forEach((i, k) => {
      i.style.background = k < lit ? (k >= 13 ? '#fff' : s.chg >= 0 ? BUY : SELL) : '#26262b';
      i.style.boxShadow = k < lit ? `0 0 6px ${s.chg >= 0 ? BUY : SELL}` : 'none';
    }));
  });
});

let shown = '';
function drawPrice() {
  if (S.price == null) return;
  const s = fmt(S.price);
  if (s === shown) return;
  shown = s;
  const [i, d] = s.split('.');
  $('price').innerHTML = `${i}<small>.${d}</small>`;
  document.title = s + ' · BTC';
}
Feed.on('ticker', () => {
  const t = S.ticker;
  $('pct').textContent = pct(t.P); $('pct').className = cls(t.P);
  $('h').textContent = fmt(t.h, 0); $('l').textContent = fmt(t.l, 0);
});
function clocks() {
  $('tpe').textContent = Feed.tzNow('Asia/Taipei').str; $('nyc').textContent = Feed.tzNow('America/New_York').str;
  const e = Math.floor((Date.now() - t0) / 1000);
  $('rt').textContent = [e / 3600, (e / 60) % 60, e % 60].map((v) => String(Math.floor(v)).padStart(2, '0')).join(':');
}
setInterval(clocks, 1000); clocks();

let lw = 0, lc = 0;
function frame(t) {
  drawPrice();
  if (t - lw > 50) { lw = t; wave(); }
  if (t - lc > 250) { lc = t; charts(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
