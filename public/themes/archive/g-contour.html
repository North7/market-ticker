<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #e6e5e1; --ink: #1d1d1b; --mute: #7d7b74; --line: #c9c7c0; --hot: #f26b1d; --up: #e0531b; --down: #1d1d1b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: 'Geist', 'Noto Sans TC', sans-serif; }
.wrap { height: 100vh; display: grid; grid-template-rows: 34px 222px minmax(0, 1fr) 150px; padding: 0 30px 18px; }
.top { display: flex; gap: 26px; align-items: center; font-family: 'Geist Mono'; font-size: 10.5px; letter-spacing: .22em; color: var(--mute); text-transform: uppercase; border-bottom: 1px solid var(--line); }
.top b { color: var(--ink); font-weight: 500; }
.top .sp { margin-left: auto; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: end; padding-bottom: 12px; }
.price { font-weight: 200; font-size: min(25vh, 222px); line-height: .84; letter-spacing: -.06em; white-space: nowrap; margin-left: -8px; }
.price small { font-size: .34em; font-weight: 300; color: var(--hot); letter-spacing: -.03em; }
.side { padding-bottom: 6px; }
.side .pct { font-weight: 300; font-size: 44px; letter-spacing: -.03em; }
.side .kv { font-family: 'Geist Mono'; font-size: 12px; color: var(--mute); display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; margin-top: 6px; }
.side .kv b { color: var(--ink); font-weight: 500; }
.side canvas { width: 100%; height: 46px; margin-top: 10px; display: block; }
.map { position: relative; min-height: 0; }
.map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .leg { position: absolute; right: 0; bottom: 4px; font-family: 'Geist Mono'; font-size: 10.5px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.map .leg i { display: inline-block; width: 20px; height: 2px; background: var(--hot); vertical-align: middle; margin: 0 8px 0 18px; }
.map .leg u { display: inline-block; width: 20px; height: 1.5px; background: var(--ink); vertical-align: middle; margin: 0 8px 0 18px; text-decoration: none; }
.stocks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.st { position: relative; padding: 12px 16px 8px; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; }
.st:last-child { border-right: 0; }
.st .nm { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; white-space: nowrap; }
.st .nm span { font-family: 'Noto Sans TC'; font-weight: 500; }
.st .nm small { font-family: 'Geist Mono'; font-weight: 400; font-size: 10.5px; color: var(--mute); letter-spacing: .1em; }
.st .nm small.on { color: var(--hot); }
.st .px { font-weight: 300; font-size: 30px; letter-spacing: -.04em; display: flex; justify-content: space-between; align-items: baseline; }
.st .px em { font-family: 'Geist Mono'; font-style: normal; font-size: 12px; letter-spacing: 0; }
.st canvas { width: 100%; height: 100%; min-height: 0; }
.u { color: var(--up); } .d { color: var(--down); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><b>Contour</b> · BTC / USDT · price terrain</span><span>terrain = price − 60 min average</span>
    <span class="sp">TPE <b id="tpe">--</b></span><span>NYC <b id="nyc">--</b></span><span>UTC <b id="utc">--</b></span></div>
  <div class="head">
    <div class="price" id="price">—</div>
    <div class="side">
      <div class="pct" id="pct">—</div>
      <div class="kv"><span>H <b id="h">—</b></span><span>L <b id="l">—</b></span><span>AMP <b id="amp">—</b></span><span>4H <b id="k4h">—</b></span></div>
      <canvas id="c4h"></canvas>
    </div>
  </div>
  <div class="map"><canvas id="cv"></canvas><canvas id="ov"></canvas>
    <div class="leg"><u></u>contour <span id="step">—</span> USDT<i></i>zero line · price = its 60-min average · warm = above, cool = below</div></div>
  <section class="stocks" id="stocks"></section>
</div>

<script src="../feed.js"></script>
<script src="../draw.js"></script>
<script>
const { S, fmt, pct } = Feed;
const $ = (id) => document.getElementById(id);
const HOT = '#f26b1d', INK = '#1d1d1b';
const cls = (v) => (v > 0 ? 'u' : v < 0 ? 'd' : '');
Feed.start({ '1m': 960, '4h': 90 });

let grid = null;   // { R, C, v[r][c], hrs, lo, hi, rect }
function buildGrid() {
  const bars = S.bars['1m'];
  if (!bars || bars.length < 120) return null;
  // 地形高度＝價格減去自己的 60 分鐘移動平均：漲勢是山丘，跌勢是山谷
  const rows = [];
  let sum = 0;
  bars.forEach((b, i) => {
    sum += b.c; if (i >= 60) sum -= bars[i - 60].c;
    if (i < 59) return;
    const hr = Math.floor(b.t / 3600);
    if (!rows.length || rows[rows.length - 1].hr !== hr) rows.push({ hr, v: new Array(60).fill(NaN) });
    rows[rows.length - 1].v[new Date(b.t * 1000).getUTCMinutes()] = b.c - sum / 60;
  });
  const rs = rows.slice(-16);
  // 雙線性放大，等高線比較圓滑
  const FY = 5, FX = 2;
  const R = (rs.length - 1) * FY + 1, C = 59 * FX + 1;
  const v = [];
  let lo = Infinity, hi = -Infinity;
  for (let r = 0; r < R; r++) {
    const row = [];
    const r0 = Math.floor(r / FY), r1 = Math.min(rs.length - 1, r0 + 1), fr = (r % FY) / FY;
    for (let c = 0; c < C; c++) {
      const c0 = Math.floor(c / FX), c1 = Math.min(59, c0 + 1), fc = (c % FX) / FX;
      const a = rs[r0].v[c0], b = rs[r0].v[c1], d = rs[r1].v[c0], e = rs[r1].v[c1];
      const top = a + (b - a) * fc, bot = d + (e - d) * fc;
      const val = top + (bot - top) * fr;
      row.push(val);
      if (isFinite(val)) { lo = Math.min(lo, val); hi = Math.max(hi, val); }
    }
    v.push(row);
  }
  // 二維平滑（忽略空格），讓等高線收成山丘
  const blur = (src, rx, ry) => src.map((row, r) => row.map((val, c) => {
    if (!isFinite(val)) return NaN;
    let s = 0, n = 0;
    for (let dy = -ry; dy <= ry; dy++) for (let dx = -rx; dx <= rx; dx++) {
      const q = src[r + dy] && src[r + dy][c + dx];
      if (isFinite(q)) { s += q; n++; }
    }
    return s / n;
  }));
  let sm = blur(blur(v, 3, 3), 3, 3);
  lo = Infinity; hi = -Infinity;
  for (const row of sm) for (const val of row) if (isFinite(val)) { lo = Math.min(lo, val); hi = Math.max(hi, val); }
  return { R, C, v: sm, rs, lo, hi };
}

function niceStep(range, n) { const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }

// marching squares
function contour(ctx, g, level, X, Y) {
  const { R, C, v } = g;
  ctx.beginPath();
  for (let r = 0; r < R - 1; r++) {
    for (let c = 0; c < C - 1; c++) {
      const a = v[r][c], b = v[r][c + 1], d = v[r + 1][c + 1], e = v[r + 1][c];
      if (!(isFinite(a) && isFinite(b) && isFinite(d) && isFinite(e))) continue;
      const idx = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (d > level ? 2 : 0) | (e > level ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const t = (p, q) => (level - p) / (q - p);
      const T = [c + t(a, b), r], Rr = [c + 1, r + t(b, d)], B = [c + t(e, d), r + 1], L = [c, r + t(a, e)];
      const seg = (p1, p2) => { ctx.moveTo(X(p1[0]), Y(p1[1])); ctx.lineTo(X(p2[0]), Y(p2[1])); };
      switch (idx) {
        case 1: case 14: seg(L, B); break;
        case 2: case 13: seg(B, Rr); break;
        case 3: case 12: seg(L, Rr); break;
        case 4: case 11: seg(T, Rr); break;
        case 5: seg(L, T); seg(B, Rr); break;
        case 6: case 9: seg(T, B); break;
        case 7: case 8: seg(L, T); break;
        case 10: seg(T, Rr); seg(L, B); break;
      }
    }
  }
}

let rect = null;
function drawMap() {
  grid = buildGrid();
  const { ctx, w, h } = Draw.fit($('cv'));
  if (!grid) return;
  const L = 64, T = 26, Rt = w - 4, B = h - 26;
  rect = { L, T, Rt, B };
  const X = (c) => L + c / (grid.C - 1) * (Rt - L), Y = (r) => T + r / (grid.R - 1) * (B - T);
  // 高程淡色
  const off = document.createElement('canvas'); off.width = grid.C; off.height = grid.R;
  const oc = off.getContext('2d'), img = oc.createImageData(grid.C, grid.R);
  for (let r = 0; r < grid.R; r++) for (let c = 0; c < grid.C; c++) {
    const val = grid.v[r][c], k = (r * grid.C + c) * 4;
    if (!isFinite(val)) { img.data[k + 3] = 0; continue; }
    const z = val / Math.max(grid.hi, -grid.lo, 1e-9);   // -1..1
    const warm = [246, 214, 186], cool = [196, 199, 204], mid = [230, 229, 225];
    const t = Math.min(1, Math.abs(z)), tgt = z >= 0 ? warm : cool;
    for (let q = 0; q < 3; q++) img.data[k + q] = mid[q] + (tgt[q] - mid[q]) * t;
    img.data[k + 3] = 255;
  }
  oc.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(off, L, T, Rt - L, B - T);
  // 等高線
  const step = niceStep(grid.hi - grid.lo, 16);
  $('step').textContent = step >= 1 ? step.toFixed(0) : step.toFixed(1);
  const first = Math.ceil(grid.lo / step) * step;
  for (let lv = first, i = Math.round(first / step); lv <= grid.hi; lv += step, i++) {
    const major = i % 5 === 0;
    contour(ctx, grid, lv, X, Y);
    ctx.strokeStyle = major ? 'rgba(29,29,27,.82)' : 'rgba(29,29,27,.32)';
    ctx.lineWidth = major ? 1.3 : 0.8; ctx.lineCap = 'round'; ctx.stroke();
  }
  // 零等高線：價格剛好等於 60 分鐘均價
  contour(ctx, grid, 0, X, Y);
  ctx.strokeStyle = HOT; ctx.lineWidth = 2.2; ctx.stroke();
  // 刻度
  ctx.fillStyle = '#7d7b74'; ctx.font = '10.5px "Geist Mono"'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  grid.rs.forEach((row, i) => ctx.fillText(new Date(row.hr * 3600e3).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), L - 12, Y(i * 5)));
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  [0, 15, 30, 45, 59].forEach((m) => ctx.fillText(':' + String(m).padStart(2, '0'), X(m * 2), T - 8));
}

// 現價等高線（橘）每半秒重畫在上層
function drawNow() {
  const { ctx, w, h } = Draw.fit($('ov'));
  if (!grid || !rect || S.price == null) return;
  const { L, T, Rt, B } = rect;
  const X = (c) => L + c / (grid.C - 1) * (Rt - L), Y = (r) => T + r / (grid.R - 1) * (B - T);
  // 現在的位置
  const lastRow = grid.rs.length - 1, m = new Date().getUTCMinutes();
  const x = X(m * 2), y = Y(lastRow * 5);
  const pulse = (Date.now() % 1600) / 1600;
  ctx.fillStyle = HOT; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(242,107,29,${1 - pulse})`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, 6 + pulse * 22, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = INK; ctx.font = '500 11px "Geist Mono"'; ctx.textAlign = x > w - 140 ? 'right' : 'left'; ctx.textBaseline = 'bottom';
  const b1 = S.bars['1m'], avg = b1.slice(-60).reduce((a, b) => a + b.c, 0) / Math.min(60, b1.length), dv = S.price - avg;
  ctx.fillText(`NOW ${dv >= 0 ? '+' : ''}${dv.toFixed(1)} vs 1H avg`, x + (x > w - 140 ? -12 : 12), y - 8);
}

let shown = '';
function drawPrice() {
  if (S.price == null) return;
  const s = fmt(S.price);
  if (s === shown) return;
  shown = s;
  const [i, d] = s.split('.');
  $('price').innerHTML = `${i}<small>.${d}</small>`;
  document.title = s + ' · BTC';
}
Feed.on('ticker', () => {
  const t = S.ticker;
  $('pct').textContent = pct(t.P); $('pct').className = 'pct ' + cls(t.P);
  $('h').textContent = fmt(t.h, 0); $('l').textContent = fmt(t.l, 0);
  $('amp').textContent = ((t.h - t.l) / t.o * 100).toFixed(2) + '%';
});

const cards = {};
Feed.on('markets', () => {
  S.markets.forEach((s) => {
    let c = cards[s.id];
    if (!c) {
      const el = document.createElement('div');
      el.className = 'st';
      el.innerHTML = `<div class="nm"><span>${s.name.replace(' ETF', '')}</span><small>${s.code}</small></div><div class="px">—</div><canvas></canvas>`;
      $('stocks').appendChild(el);
      c = cards[s.id] = { el, q: (x) => el.querySelector(x) };
    }
    if (s.price == null) return;
    c.q('.px').innerHTML = `${fmt(s.price, s.dec)}<em class="${cls(s.chg)}">${pct(s.pct)}</em>`;
    const tag = c.q('.nm small'); tag.textContent = (s.isOpen ? '● ' : '') + s.code; tag.className = s.isOpen ? 'on' : '';
    // 剖面圖：昨收為海平面
    Draw.spark(c.q('canvas'), s.bars, { mode: 'area', slots: s.market === 'TW' ? 54 : 78, base: s.prevClose, line: INK, lineWidth: 1.2,
      fill: 'rgba(29,29,27,.1)', baseColor: 'rgba(242,107,29,.8)', baseDash: [3, 3], dot: HOT, dotR: 3 });
  });
});

function clocks() { $('tpe').textContent = Feed.tzNow('Asia/Taipei').str; $('nyc').textContent = Feed.tzNow('America/New_York').str; $('utc').textContent = Feed.tzNow('UTC').str; }
setInterval(clocks, 1000); clocks();

Feed.on('bars', (tf) => { if (tf === '1m') drawMap(); });
setInterval(drawMap, 20000);
addEventListener('resize', drawMap);
let lastNow = 0, last4 = 0;
function frame(t) {
  drawPrice();
  if (t - lastNow > 120) { lastNow = t; drawNow(); }
  if (t - last4 > 2000) {
    last4 = t;
    const r = Draw.candles($('c4h'), S.bars['4h'], { mode: 'line', count: 90, pad: { t: 4, r: 6, b: 4, l: 0 }, rightGap: 0, line: INK, lineWidth: 1.1 });
    if (r) {
      const ctx = $('c4h').getContext('2d'); ctx.fillStyle = HOT; ctx.beginPath(); ctx.arc(r.last.x, r.last.y, 3.5, 0, Math.PI * 2); ctx.fill();
      const b = S.bars['4h'], lb = b[b.length - 1]; const v = (lb.c - lb.o) / lb.o * 100;
      $('k4h').textContent = pct(v); $('k4h').className = cls(v);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
