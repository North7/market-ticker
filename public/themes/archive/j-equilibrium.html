<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilibrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #efeee9; --ink: #121212; --mute: #8a8880; --line: #d6d4cc; --hot: #f7931a; --up: #e0650c; --down: #121212; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: 'Geist', 'Noto Sans TC', sans-serif; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; }
.top { position: fixed; left: 34px; right: 34px; top: 22px; display: flex; gap: 26px; font-family: 'Geist Mono'; font-size: 10.5px; letter-spacing: .22em; color: var(--mute); text-transform: uppercase; z-index: 2; }
.top b { color: var(--ink); font-weight: 500; }
.top .sp { margin-left: auto; }
.price { position: fixed; left: 28px; top: 46px; z-index: 2; font-weight: 100; font-size: min(27vh, 236px); line-height: .9; letter-spacing: -.06em; white-space: nowrap; }
.price small { font-size: .33em; font-weight: 200; color: var(--hot); letter-spacing: -.02em; }
.side { position: fixed; right: 36px; top: 62px; text-align: right; z-index: 2; }
.side .pct { font-weight: 200; font-size: 64px; letter-spacing: -.04em; line-height: 1; }
.side .kv { font-family: 'Geist Mono'; font-size: 12px; color: var(--mute); margin-top: 10px; line-height: 1.8; }
.side .kv b { color: var(--ink); font-weight: 500; margin-left: 6px; }
.flow { position: fixed; left: 0; right: 0; text-align: center; font-family: 'Geist Mono'; font-size: 11px; letter-spacing: .22em; color: var(--mute); text-transform: uppercase; z-index: 2; }
.flow b { color: var(--ink); font-weight: 500; }
.flow .hot { color: var(--up); }
.stocks { position: fixed; left: 28px; right: 28px; bottom: 20px; height: 118px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--ink); z-index: 2; }
.st { display: grid; grid-template-columns: minmax(0, 1fr) 64px; grid-template-rows: auto auto auto; column-gap: 8px; padding: 12px 16px 0; border-right: 1px solid var(--line); align-content: start; }
.st:last-child { border-right: 0; }
.st .nm { font-family: 'Noto Sans TC'; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st .nm small { font-family: 'Geist Mono'; font-size: 10px; color: var(--mute); margin-left: 6px; letter-spacing: .1em; }
.st .px { font-weight: 200; font-size: 32px; letter-spacing: -.05em; line-height: 1.1; grid-column: 1; }
.st .pc { font-family: 'Geist Mono'; font-size: 12px; grid-column: 1; }
.st canvas { grid-column: 2; grid-row: 1 / 4; width: 64px; height: 76px; align-self: center; }
.u { color: var(--up); } .d { color: var(--down); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top"><span><b>Equilibrium</b> · BTC / USDT · order flow balance</span><span class="sp">TPE <b id="tpe">--</b></span><span>NYC <b id="nyc">--</b></span></div>
<div class="price" id="price">—</div>
<div class="side"><div class="pct" id="pct">—</div><div class="kv">H<b id="h">—</b> · L<b id="l">—</b><br>AMP<b id="amp">—</b> · 4H<b id="k4h">—</b></div></div>
<div class="flow" id="flow">—</div>
<section class="stocks" id="stocks"></section>

<script src="../feed.js"></script>
<script src="../draw.js"></script>
<script>
const { S, fmt, pct } = Feed;
const $ = (id) => document.getElementById(id);
const INK = '#121212', HOT = '#f7931a';
const cls = (v) => (v > 0 ? 'u' : v < 0 ? 'd' : '');
Feed.start({ '1m': 180, '4h': 90 });
const WIN = 60000, MAXA = 16 * Math.PI / 180;

// 阻尼彈簧：橫樑角度、兩顆圓的半徑都平滑跟隨
const st = { a: 0, va: 0, rb: 30, rs: 30, buy: 0, sell: 0 };
function flow() {
  const now = Date.now();
  let buy = 0, sell = 0;
  for (const t of S.ticks) { if (t.T < now - WIN) continue; if (t.m) sell += t.q; else buy += t.q; }
  st.buy = buy; st.sell = sell;
  return { buy, sell };
}

function scene(dt) {
  const { ctx, w, h } = Draw.fit($('cv'));
  const { buy, sell } = flow();
  const tot = buy + sell;
  const bias = tot ? (buy - sell) / tot : 0;            // -1..1
  const target = bias * MAXA;                           // 買多 → 右側（橘）下沉
  st.va += ((target - st.a) * 18 - st.va * 4.2) * dt;  // 彈簧 + 阻尼
  st.a += st.va * dt;
  const Rmax = Math.min(118, h * 0.13);
  const share = (q) => (tot ? Math.sqrt(q / tot) : 0.7);
  st.rb += (Rmax * share(buy) - st.rb) * Math.min(1, dt * 3);
  st.rs += (Rmax * share(sell) - st.rs) * Math.min(1, dt * 3);

  const cx = w / 2, cy = h * 0.46, L = Math.min(w * 0.36, 520);
  // 1 分鐘價格線當地平線
  const bars = S.bars['1m'];
  if (bars && bars.length) {
    const d = bars.slice(-180);
    let hi = -Infinity, lo = Infinity; for (const b of d) { hi = Math.max(hi, b.h); lo = Math.min(lo, b.l); }
    const y0 = h - 330, y1 = h - 168;
    ctx.beginPath();
    d.forEach((b, i) => { const x = 34 + (w - 68) * i / (d.length - 1), y = y1 - (b.c - lo) / (hi - lo || 1) * (y1 - y0); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = 'rgba(18,18,18,.18)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '10px "Geist Mono"'; ctx.fillStyle = '#8a8880'; ctx.textAlign = 'left';
    ctx.fillText('1M · 3 HOURS', 34, y1 + 14);
  }
  // 支點
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 16, cy + 30); ctx.lineTo(cx + 16, cy + 30); ctx.closePath(); ctx.fill();
  ctx.fillRect(cx - 60, cy + 30, 120, 1.5);
  // 橫樑
  const ex = Math.cos(st.a) * L, ey = Math.sin(st.a) * L;
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - ex, cy - ey); ctx.lineTo(cx + ex, cy + ey); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fillStyle = '#efeee9'; ctx.fill(); ctx.stroke();
  // 刻度
  for (let k = -10; k <= 10; k++) {
    if (!k) continue;
    const px = cx + Math.cos(st.a) * L * k / 10, py = cy + Math.sin(st.a) * L * k / 10;
    const nx = -Math.sin(st.a), ny = Math.cos(st.a), len = k % 5 ? 4 : 9;
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - nx * len, py - ny * len); ctx.stroke();
  }
  // 吊繩與圓
  const hang = (x, y, r, fill, label, q) => {
    const sl = 54;
    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + sl); ctx.stroke();
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y + sl + r, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fill === INK ? '#efeee9' : INK;
    ctx.font = '500 11px "Geist Mono"'; ctx.textAlign = 'center';
    if (r > 26) { ctx.fillText(label, x, y + sl + r - 4); ctx.font = '300 15px "Geist"'; ctx.fillText(q.toFixed(3) + ' BTC', x, y + sl + r + 14); }
    else { ctx.fillStyle = INK; ctx.fillText(`${label} ${q.toFixed(3)}`, x, y + sl + r * 2 + 16); }
  };
  hang(cx - ex, cy - ey, Math.max(6, st.rs), INK, 'SELL', sell);
  hang(cx + ex, cy + ey, Math.max(6, st.rb), HOT, 'BUY', buy);

  const fl = $('flow');
  fl.style.top = (cy + 46) + 'px';
  const ratio = tot ? buy / tot * 100 : 50;
  fl.innerHTML = `taker flow · last 60 s · buy <b class="hot">${ratio.toFixed(1)}%</b> / sell <b>${(100 - ratio).toFixed(1)}%</b> · tilt <b>${(st.a * 180 / Math.PI).toFixed(1)}°</b>`;
}

let shown = '';
function drawPrice() {
  if (S.price == null) return;
  const s = fmt(S.price);
  if (s === shown) return;
  shown = s;
  const [i, d] = s.split('.');
  $('price').innerHTML = `${i}<small>.${d}</small>`;
  document.title = s + ' · BTC';
}
Feed.on('ticker', () => {
  const t = S.ticker;
  $('pct').textContent = pct(t.P); $('pct').className = 'pct ' + cls(t.P);
  $('h').textContent = fmt(t.h, 0); $('l').textContent = fmt(t.l, 0);
  $('amp').textContent = ((t.h - t.l) / t.o * 100).toFixed(2) + '%';
  const b = S.bars['4h']; if (b && b.length) { const lb = b[b.length - 1], v = (lb.c - lb.o) / lb.o * 100; $('k4h').textContent = pct(v); }
});

// 個股：一根小天平，傾斜角＝今日漲跌
const cards = {};
Feed.on('markets', () => {
  S.markets.forEach((s) => {
    let c = cards[s.id];
    if (!c) {
      const el = document.createElement('div');
      el.className = 'st';
      el.innerHTML = `<div class="nm">${s.name.replace(' ETF', '')}<small>${s.code}</small></div><div class="px">—</div><div class="pc">—</div><canvas></canvas>`;
      $('stocks').appendChild(el);
      c = cards[s.id] = { el, q: (x) => el.querySelector(x) };
    }
    if (s.price == null) return;
    c.q('.px').textContent = fmt(s.price, s.dec);
    c.q('.pc').innerHTML = `<span class="${cls(s.chg)}">${pct(s.pct)}</span>${s.isOpen ? ' · LIVE' : ''}`;
    const { ctx, w, h } = Draw.fit(c.q('canvas'));
    const a = -Math.max(-1, Math.min(1, s.pct / 4)) * 0.5;   // 漲 → 右端上揚
    const cx = w / 2, cy = h / 2, L = w / 2 - 6;
    ctx.strokeStyle = 'rgba(18,18,18,.2)'; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(cx - L, cy); ctx.lineTo(cx + L, cy); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * L, cy - Math.sin(a) * L); ctx.lineTo(cx + Math.cos(a) * L, cy + Math.sin(a) * L); ctx.stroke();
    ctx.fillStyle = s.chg >= 0 ? HOT : INK;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * L, cy + Math.sin(a) * L, 4 + Math.min(6, s.amp * 1.5), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 5, cy + 9); ctx.lineTo(cx + 5, cy + 9); ctx.fill();
  });
});

function clocks() { $('tpe').textContent = Feed.tzNow('Asia/Taipei').str; $('nyc').textContent = Feed.tzNow('America/New_York').str; }
setInterval(clocks, 1000); clocks();

let prev = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - prev) / 1000); prev = t;
  drawPrice(); scene(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
